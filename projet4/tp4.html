<center>
	<body bgcolor="bleue" >
<form action="#" method="post">
	<h1> Inscription d'un nouveau clien </h1>
	<table border="2" width="75%">
	 <tr> <td> <br> <label form="nom" > Nom : </label> </td>
	   <td><input type="text" id="nom" name="nom"> </td> </tr> <br>
	   
	   <tr> <td><label form="prenom"> Prénom : </label></td>
	    <td><input type="text"id= "prenom"  name="Prénom "><br></td></tr>

	    <tr> <td><label form="date  naissance">Date de naissance :</label></td><td>
	    <input type="date" id="date  naissance" name="date de naissance"></td></tr> <br>

	    <tr><td><label form="emai">Adresse mail : </label></td><td>
	    <input type="email" id="email" name="email"> </td></tr>

	    <tr> <td><label for="mdp">Mot de passe :</label> </td> <td>
        <input type="password" id="mdp" name="mdp"> </td></tr>

        <input type="text" id="permis" name="permis"> </td></tr>

        <input type="number" id="anciennete" name="anciennete" min="0" max="80"> </td></tr>

        <tr><td><label for="ville">ville </label></td> <td>
        <select id="ville " name="ville">
        	<option value="paris"> Paris </option>
        	<option value="versailles">versailles</option>
        	<option value="creteil">creteil</option>
        </select> </td></tr>

        <tr><td><label for="Adresse"> adresse du clien </label></td><td>
        <textarea id="Adresse" name="adresse" rows="4" cols="20"></textarea> </td> <td>

        <tr><td><p>Situation matimoniale :</p></td>
        <td><label for="marie_oui"> Marie</label>
        <input type="radio" id="marie_oui" name="Marie" value=" oui">
        <label for="marie_non">Non marie</label>
        <input type="radio" id="marie_non " name="marie" value="non"> </td></tr>

        <tr><td><p>Préférence de voiture :</p></td>
        <td><label for="pref_auto"> Automatique</label>
        <input type="checkbox" id="pref_auto" name="Préférence_auto" value="automatique">
        <label for="pref_manuelle"> Manuelle</label>
        <input type="checkbox" id="pref_manuelle" name="Préférence_manuelle" value="Manuelle"></td></tr>

       <tr><td> <button type="submit"> Enregistrer</button></td>
        <td><button type="reset">Annuler</button></td>
        </table>
